name: pencil_canvas
description: "Minimal PencilKit canvas (pen only, no persistence) as a Flutter platform view."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PencilCanvasPlugin
